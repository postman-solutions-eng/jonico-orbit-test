<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magical Worlds: Harry Potter &amp; Octocat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 2.5rem 1rem 1.5rem;
      background: linear-gradient(135deg, #1c0e05 0%, #0d1117 50%, #0d1a2b 100%);
      border-bottom: 1px solid #30363d;
    }
    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 800;
      background: linear-gradient(90deg, #f5a623, #c0392b, #8e44ad, #2980b9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    header p {
      margin-top: .5rem;
      color: #8b949e;
      font-size: .95rem;
    }

    /* ── Two-column layout ── */
    .worlds {
      display: flex;
      gap: 1.5rem;
      padding: 2rem 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .world {
      flex: 1 1 0;
      min-width: 0;
    }

    /* Section headings */
    .world-header {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .75rem 1rem;
      border-radius: 10px 10px 0 0;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .hp-header  { background: linear-gradient(90deg, #7b0000, #4a1a00); border: 1px solid #c0392b; color: #f5c518; }
    .oc-header  { background: linear-gradient(90deg, #1a1a2e, #16213e); border: 1px solid #6e40c9; color: #c9d1d9; }

    /* ── Spinner ── */
    .spinner-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3rem;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #30363d;
      border-top-color: #f5a623;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .oc-spinner { border-top-color: #6e40c9; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    .error-msg {
      background: #2d1117;
      border: 1px solid #c0392b;
      color: #ff7b72;
      border-radius: 8px;
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    /* ── Card grid ── */
    .cards { display: flex; flex-direction: column; gap: 1rem; }

    /* ── HP Card ── */
    .hp-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      gap: 1rem;
      padding: 1rem;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }
    .hp-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(197,52,24,.25);
      border-color: #c0392b;
    }
    .hp-portrait {
      flex: 0 0 80px;
      width: 80px; height: 100px;
      object-fit: cover;
      border-radius: 8px;
      background: #21262d;
    }
    .hp-portrait.fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    .hp-info { flex: 1; min-width: 0; }
    .hp-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f0c040;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badges { display: flex; flex-wrap: wrap; gap: .35rem; margin: .4rem 0; }
    .badge {
      font-size: .7rem;
      font-weight: 600;
      padding: .2rem .55rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .house-gryffindor { background: #7b0000; color: #f5c518; border: 1px solid #c0392b; }
    .house-slytherin   { background: #0d3318; color: #4caf50; border: 1px solid #2e7d32; }
    .house-hufflepuff  { background: #423200; color: #f5c518; border: 1px solid #f9a825; }
    .house-ravenclaw   { background: #0a1e3f; color: #64b5f6; border: 1px solid #1565c0; }
    .house-unknown     { background: #21262d; color: #8b949e; border: 1px solid #30363d; }
    .badge-student { background: #0f2a1e; color: #3fb950; border: 1px solid #238636; }
    .badge-staff   { background: #162032; color: #79c0ff; border: 1px solid #388bfd; }
    .hp-meta { font-size: .8rem; color: #8b949e; line-height: 1.7; }
    .hp-meta span { color: #c9d1d9; }

    /* ── Octocat Card ── */
    .oc-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      transition: transform .25s, box-shadow .25s, border-color .25s;
      cursor: pointer;
    }
    .oc-card:hover {
      transform: scale(1.03);
      box-shadow: 0 12px 32px rgba(110,64,201,.4);
      border-color: #6e40c9;
    }
    .oc-img-wrap {
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      background: #0d1117;
    }
    .oc-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .3s;
    }
    .oc-card:hover .oc-img-wrap img { transform: scale(1.06); }
    .oc-body { padding: .75rem 1rem; }
    .oc-name {
      font-size: 1rem;
      font-weight: 700;
      color: #c9d1d9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .oc-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: .35rem;
    }
    .oc-num {
      font-size: .72rem;
      font-weight: 600;
      padding: .15rem .5rem;
      background: #1f1035;
      border: 1px solid #6e40c9;
      border-radius: 999px;
      color: #b392f0;
    }
    .oc-link {
      font-size: .78rem;
      color: #6e40c9;
      text-decoration: none;
      transition: color .15s;
    }
    .oc-link:hover { color: #b392f0; text-decoration: underline; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .worlds { flex-direction: column; padding: 1rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>✨ Magical Worlds: Harry Potter &amp; Octocat ✨</h1>
  <p>APIs discovered via <strong>Orbit by Postman</strong> — no API key required</p>
</header>

<main class="worlds">

  <!-- ── Harry Potter ── -->
  <section class="world" id="hp-world">
    <div class="world-header hp-header">⚡ Harry Potter Characters</div>
    <div id="hp-content">
      <div class="spinner-wrap"><div class="spinner"></div></div>
    </div>
  </section>

  <!-- ── Octocats ── -->
  <section class="world" id="oc-world">
    <div class="world-header oc-header">🐙 Octocat Characters</div>
    <div id="oc-content">
      <div class="spinner-wrap"><div class="spinner oc-spinner"></div></div>
    </div>
  </section>

</main>

<script>
  // ── Helpers ──────────────────────────────────────────────────────────────
  const houseBadgeClass = h => {
    const m = { gryffindor: 'house-gryffindor', slytherin: 'house-slytherin',
                hufflepuff: 'house-hufflepuff', ravenclaw: 'house-ravenclaw' };
    return m[(h || '').toLowerCase()] || 'house-unknown';
  };

  const esc = s => {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  };

  const metaRow = (label, val) =>
    val ? `<div class="hp-meta">${esc(label)}: <span>${esc(val)}</span></div>` : '';

  // ── Harry Potter card ───────────────────────────────────────────────────
  function buildHPCard(c) {
    const house = c.house || '';
    const portrait = c.image
      ? `<img class="hp-portrait" src="${esc(c.image)}" alt="${esc(c.name)}" loading="lazy" onerror="this.src='https://via.placeholder.com/80x100/21262d/8b949e?text=🧙'">`
      : `<div class="hp-portrait fallback">🧙</div>`;

    const houseBadge = `<span class="badge ${houseBadgeClass(house)}">${esc(house || 'Unknown')}</span>`;
    const roleBadge  = c.hogwartsStudent
      ? `<span class="badge badge-student">Student</span>`
      : c.hogwartsStaff
        ? `<span class="badge badge-staff">Staff</span>`
        : '';

    return `
      <article class="hp-card">
        ${portrait}
        <div class="hp-info">
          <div class="hp-name">${esc(c.name)}</div>
          <div class="badges">${houseBadge}${roleBadge}</div>
          ${metaRow('Species', c.species)}
          ${metaRow('Gender', c.gender)}
          ${metaRow('Born', c.dateOfBirth)}
          ${metaRow('Ancestry', c.ancestry)}
          ${metaRow('Patronus', c.patronus)}
        </div>
      </article>`;
  }

  // ── Octocat card ────────────────────────────────────────────────────────
  function buildOCCard(cat, idx) {
    const name = cat.title || `Octocat #${idx + 1}`;
    const img  = cat.octocat || '';
    const num  = idx + 1;
    const octoLink = cat.url || 'https://octodex.github.com';
    return `
      <article class="oc-card">
        <div class="oc-img-wrap">
          <img src="${esc(img)}" alt="${esc(name)}" loading="lazy"
               onerror="this.src='https://octodex.github.com/images/original.png'">
        </div>
        <div class="oc-body">
          <div class="oc-name">${esc(name)}</div>
          <div class="oc-meta">
            <span class="oc-num">#${num}</span>
            <a class="oc-link" href="${esc(octoLink)}" target="_blank" rel="noopener">
              View on Octodex ↗
            </a>
          </div>
        </div>
      </article>`;
  }

  // ── Render helpers ───────────────────────────────────────────────────────
  function renderCards(containerId, html) {
    document.getElementById(containerId).innerHTML =
      `<div class="cards">${html}</div>`;
  }

  function renderError(containerId, msg) {
    document.getElementById(containerId).innerHTML =
      `<div class="error-msg">⚠️ ${esc(msg)}</div>`;
  }

  // ── Fetch both APIs in parallel ──────────────────────────────────────────
  const HP_URL = 'https://hp-api.onrender.com/api/characters';
  const OC_URL = 'https://octodex-rest-api-ccc20c6c9fbf.herokuapp.com/octocats';

  fetch(HP_URL)
    .then(r => { if (!r.ok) throw new Error(`HP API returned ${r.status}`); return r.json(); })
    .then(data => {
      const chars = (Array.isArray(data) ? data : []).slice(0, 5);
      if (chars.length === 0) renderError('hp-content', 'No Harry Potter characters returned.');
      else renderCards('hp-content', chars.map(buildHPCard).join(''));
    })
    .catch(e => renderError('hp-content', e.message || 'Failed to load Harry Potter data.'));

  fetch(OC_URL, { headers: { 'x-mock-response-name': 'Octocats-JSON' } })
    .then(r => { if (!r.ok) throw new Error(`Octocat API returned ${r.status}`); return r.json(); })
    .then(data => {
      const list = Array.isArray(data) ? data : Array.isArray(data?.data) ? data.data : [];
      const chars = list.slice(0, 5);
      if (chars.length === 0) renderError('oc-content', 'No Octocat characters returned.');
      else renderCards('oc-content', chars.map(buildOCCard).join(''));
    })
    .catch(e => renderError('oc-content', e.message || 'Failed to load Octocat data.'));
</script>
</body>
</html>
